services:
  postgres:
    image: postgres:16-alpine
    container_name: fingent_postgres
    restart: always
    environment:
      POSTGRES_USER: fingent_admin
      POSTGRES_PASSWORD: fingent_password123
      POSTGRES_DB: fingent_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingent_admin -d fingent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
